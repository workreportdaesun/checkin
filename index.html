*{box-sizing:border-box; margin:0; padding:0;}
html{background:#dfe4ea; overflow-y:scroll; scrollbar-gutter:stable;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh; padding:10px 10px 40px; font-size:17px; position:relative; max-width:480px; margin:0 auto; box-shadow:0 0 30px rgba(0,0,0,0.12);}

.app-user{font-size:11px; opacity:.9; margin-top:4px;}
.logout-btn{background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4); color:#fff; border-radius:8px; padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; flex-shrink:0; font-family:var(--font-body);}

.card{background:var(--card); border:1px solid var(--card-bd); border-radius:12px; padding:16px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,0.06);}

.f{width:100%; background:var(--field-bg); border:1.5px solid var(--field-bd); border-radius:8px; padding:10px 11px; color:var(--ink); font-size:16px; font-family:var(--font-body); margin-bottom:10px;}

.ci-status{font-size:16px; font-weight:700; color:var(--ink); line-height:1.6; margin-bottom:14px;}
.ci-status .dim{font-size:13px; font-weight:400; color:var(--lbl);}
.ci-sub{font-size:12.5px; color:var(--lbl); text-align:center; margin-top:6px;}
.ci-done{display:flex; align-items:center; gap:8px; background:rgba(39,174,96,0.1); border:1px solid rgba(39,174,96,0.35); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:700; color:#1c7a44;}

var POSITION_OPTIONS = ['운영관리자','현장소장','공무부장','공무과장','공사부장','공사차장','품질차장','품질과장','기사','팀장','계장공','전공','조공','결선공','케이블공','LOOP','비계공','화기감시자','유도원','신호수','계기교정','기타'];
var myTeamList = ['1팀(계장)','2팀(계장)','품질팀','안전관리팀'];

function toggleMySettings(){
  var card = document.getElementById('mySettingsCard');
  var opening = card.style.display==='none';
  card.style.display = opening ? '' : 'none';
  if(opening && !mySettingsLoaded){ mySettingsLoaded = true; loadMyTeamList().then(renderMySettings); }

async function loadMyTeamList(){
  try{
    var res = await sbClient.from('app_settings').select('personnel,cats_by_menu').eq('id','global').single();
    if(!res.error && res.data){
      if(Array.isArray(res.data.personnel) && res.data.personnel.length) myTeamList = res.data.personnel;
      var data = res.data.cats_by_menu;
      if(data){ Object.keys(catsByMenu).forEach(function(m){ if(Array.isArray(data[m]) && data[m].length) catsByMenu[m] = data[m]; }); }
    }
  }catch(e){ console.error('내 정보 목록 불러오기 실패', e); }
}
function renderMySettings(){
  var menuSel = document.getElementById('myMenuSelect');
  menuSel.innerHTML = Object.keys(catsByMenu).map(function(m){ return '<option>'+m+'</option>'; }).join('');
  var savedMenu = localStorage.getItem('member_menu')||'';
  if(Object.keys(catsByMenu).indexOf(savedMenu)!==-1) menuSel.value = savedMenu;
  renderMyCatOptions();
  var teamSel = document.getElementById('myTeamSelect');
  var teamList = myTeamList.concat(['관리']);
  teamSel.innerHTML = teamList.map(function(t){ return '<option>'+t+'</option>'; }).join('');

  var menu = document.getElementById('myMenuSelect').value;
  var sel = document.getElementById('myCatSelect');
  var cur = sel.value;
  var base = catsByMenu[menu]||[];
  var list = base.indexOf('관리자')!==-1 ? base : base.concat(['관리자']);
  sel.innerHTML = list.map(function(c){ return '<option>'+c+'</option>'; }).join('');
  var savedCat = localStorage.getItem('member_cat')||'';
  if(list.indexOf(savedCat)!==-1) sel.value = savedCat;
  else if(list.indexOf(cur)!==-1) sel.value = cur;
}
async function saveMySettings(){
  var menu=document.getElementById('myMenuSelect').value;
  var cat=document.getElementById('myCatSelect').value;
  var team=document.getElementById('myTeamSelect').value;
  var position=document.getElementById('myPositionSelect').value;
  var id=localStorage.getItem('member_id');
  if(!id||!sbClient) return;
  try{
    var res=await sbClient.from('members').update({menu:menu,cat:cat,team:team,position:position}).eq('id',id);

    if(typeof loadMyStatus==='function'){ await loadMyStatus(); renderState(); }
  }catch(e){ showToast('❌ 저장 실패: '+(e.message||e), 'var(--err)'); }
}

/* 출근/퇴근 반경 게이트. 원래는 여기에 1000을 박아뒀는데(2026-08-06, "출퇴근 모두 반경
   1km로 고정"), 작업일보 인원현황의 출력체크는 app_settings.geofence_m을 읽고 있어서
   같은 현장에 기준이 두 개가 됐다 — 관리자가 admin.html에서 반경을 바꾸면 두 앱이 서로
   다른 거리로 판정한다(2026-08-10 발견). 이제 두 앱 모두 geofence_m 하나만 본다.
   현재 등록값이 1000이라 "1km 고정"은 그대로 지켜지고, 관리자가 바꾸면 양쪽이 같이 바뀐다.
   설정을 못 읽었을 때만 1000으로 진행한다.
   ※ 반경을 정말로 1km에 잠그고 싶으면 admin.html의 "반경" 입력을 없애는 쪽이 맞다. */
var GEOFENCE_M = 1000;
var SITE_LAT=null, SITE_LNG=null;
var OVERTIME_DATE=null, OVERTIME_END=null;
var myCrew = null;
var lastDistance = null, lastDistanceErr = null;

function haversineM(lat1,lng1,lat2,lng2){
  var R=6371000;
  var toRad=function(d){ return d*Math.PI/180; };
  var dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDist(m){
  return m>=1000 ? (m/1000).toFixed(1)+'km' : Math.round(m)+'m';
}
/* 안내문에 박아둔 "1km"를 실제 적용 중인 반경으로 바꾼다 — 관리자가 admin.html에서
   반경을 줄였는데 화면은 계속 1km라고 말하면 왜 안 되는지 알 수가 없다. */
function renderGeofenceNote(){
  var el=document.getElementById('geofenceNote');
  if(el) el.textContent = formatDist(GEOFENCE_M);
}

async function loadSettings(){
  try{
    var res = await sbClient.from('app_settings').select('site_lat,site_lng,geofence_m,overtime_date,overtime_end_time').eq('id','global').single();
    if(!res.error && res.data){
      SITE_LAT = res.data.site_lat; SITE_LNG = res.data.site_lng;
      if(typeof res.data.geofence_m==='number' && res.data.geofence_m>0) GEOFENCE_M = res.data.geofence_m;
      OVERTIME_DATE = res.data.overtime_date || null;
      OVERTIME_END = res.data.overtime_end_time || null;
    }
    renderGeofenceNote();
  }catch(e){ console.error('현장 설정 불러오기 실패', e); }
}

async function loadMyStatus(){
  try{
    var res = await sbClient.from('daily_reports').select('crew').eq('id', draftId()).single();
    var crew = (res.data && Array.isArray(res.data.crew)) ? res.data.crew : [];
    var memberId = localStorage.getItem('member_id');
    myCrew = crew.find(function(c){ return c.member_id===memberId; }) || null;
  }catch(e){ console.error('출력체크 상태 불러오기 실패', e); }
}

function refreshDistance(){
  return new Promise(function(resolve){
    if(SITE_LAT==null || SITE_LNG==null){ lastDistance=null; lastDistanceErr='관리자가 아직 현장 좌표를 등록하지 않았습니다.'; resolve(); return; }
    if(!navigator.geolocation){ lastDistance=null; lastDistanceErr='이 기기는 위치 확인을 지원하지 않습니다.'; resolve(); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      lastDistance = haversineM(pos.coords.latitude, pos.coords.longitude, SITE_LAT, SITE_LNG);
      lastDistanceErr = null;
      resolve();
    }, function(err){
      lastDistance=null; lastDistanceErr='위치 확인 실패: '+err.message;
      resolve();
    }, {enableHighAccuracy:true, timeout:10000});
  });
}

// 오늘 관리자가 지정한 연장근무 종료시간이 유효한지(그 날짜여야 함) — 지난 날짜 값이 남아있어도
// 오늘이 아니면 무시된다(관리자가 매일 새로 입력해야 적용, admin.html 쪽 설계와 동일).
function overtimeSetForToday(){
  return OVERTIME_DATE===todayStr() && !!OVERTIME_END;
}
function regularCheckoutGate(){
  var g=new Date(); g.setHours(16,55,0,0); return g;
}
function overtimeCheckoutGate(){
  var parts=(OVERTIME_END||'0:0').split(':');
  var g=new Date(); g.setHours(Number(parts[0])||0, (Number(parts[1])||0)+5, 0, 0); return g;
}
function checkoutGate(){
  return (myCrew && myCrew.overtimeCheckAt && overtimeSetForToday()) ? overtimeCheckoutGate() : regularCheckoutGate();
}
function fmtGate(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* RPC가 아직 안 만들어졌는지(마이그레이션 전) 판별 — PostgREST는 스키마 캐시에 없는
   함수를 부르면 PGRST202로 답한다. 그 경우에만 예전 방식으로 물러선다. */
function isMissingRpc(err){
  return !!err && (err.code==='PGRST202' || /Could not find the function/i.test(err.message||''));
}

/* 출근/연장/퇴근 기록을 daily_reports.crew 배열의 내 항목에 병합한다.
   예전엔 여기서 crew를 통째로 읽어 고친 뒤 통째로 다시 썼는데, 같은 팀 두 사람이 몇 초
   안에 체크하면 나중 사람이 "먼저 사람이 체크하기 전"의 배열을 읽어 그대로 덮어써서
   먼저 찍은 사람의 기록이 사라졌다(아침에 팀원이 한꺼번에 찍는 게 정상 상황이라 실제로
   터진다). 이제 서버 함수 upsert_crew_entry가 행을 잠그고 한 트랜잭션으로 병합한다
   — SUPABASE_CREW_UPSERT_RPC.sql 참고(work-report-daesun 저장소). */
async function updateMyCrewEntry(patch){
  var id = draftId();
  var memberId = localStorage.getItem('member_id');
  var memberName = localStorage.getItem('member_name')||'이름없음';
  var team = localStorage.getItem('member_team')||'미지정';

  var rpc = await sbClient.rpc('upsert_crew_entry', {
    p_id:id, p_team:team, p_date:todayStr(),
    p_member_id:memberId, p_member_name:memberName, p_patch:patch
  });
  if(!rpc.error) return {error:null};
  if(!isMissingRpc(rpc.error)) return {error: rpc.error};

  // ── 아래는 SQL을 아직 실행하지 않은 동안만 쓰이는 옛 경로(동시 체크에 취약) ──
  var res = await sbClient.from('daily_reports').select('crew').eq('id',id).single();
  var crew = (res.data && Array.isArray(res.data.crew)) ? res.data.crew.slice() : [];
  var idx = crew.findIndex(function(c){ return c.member_id===memberId; });
  if(idx===-1){ crew.push(Object.assign({member_id:memberId, member_name:memberName}, patch)); }
  else{ crew[idx] = Object.assign({}, crew[idx], patch); }
  var up = await sbClient.from('daily_reports').upsert({id:id, team:team, date:todayStr(), crew:crew, updated_at:new Date().toISOString()});
  return {error: up.error};
}

async function doCheckIn(){
  if(lastDistance==null || lastDistance>GEOFENCE_M){ showToast('⚠️ 반경 '+formatDist(GEOFENCE_M)+' 이내에서만 출근체크할 수 있습니다', 'var(--err)'); return; }
  // 화면 버튼은 이미 체크인했으면 안 보이지만, 두 번 연속 탭하거나 다른 탭에서 동시에 누르는
  // 경우까지 막으려고 실제 저장 직전에 서버 최신값을 한 번 더 확인한다(2026-08-06, "중복이나
  // 삭제가 되지 않도록" 요청) — updateMyCrewEntry는 병합(merge)이라 두 번 호출되면 checkInAt/
  // cat이 나중 값으로 덮어써질 수 있어, 아예 다시 쓰지 않도록 여기서 미리 막는다.
  await loadMyStatus();
  if(myCrew && myCrew.checkInAt){ showToast('이미 오늘 출근체크를 완료했습니다', 'var(--brand-2)'); renderState(); return; }
  // 작업일보(work-report-daesun)의 인원현황 작업분류별 집계가 이 스냅샷(menu/cat)을 그대로
  // 쓴다 — 그날 작업일보에 어떤 분류가 등장했는지가 아니라, 이 사람이 가입 때 등록한(또는
  // 작업일보 ⚙️설정에서 바꾼) 자기 분류로 집계된다(2026-08-06). 체크인 시점의 스냅샷이라,
  // 나중에 이 사람의 등록 분류가 바뀌어도 이미 지난 날짜의 기록은 그대로 남고(과거 데이터
  // 불변), 바뀐 이후 새로 체크인하는 날부터만 새 분류로 잡힌다 — 날짜별로 독립된 행
  // (daily_reports.id = team_date)에 스냅샷하는 구조라 자연히 그렇게 된다.
  var res = await updateMyCrewEntry({checkInAt:new Date().toISOString(), checkInDistanceM:Math.round(lastDistance), menu: localStorage.getItem('member_menu')||'', cat: localStorage.getItem('member_cat')||'', position: localStorage.getItem('member_position')||''});
  if(res.error){ showToast('❌ 출근체크 실패: '+res.error.message, 'var(--err)'); return; }
  showToast('✅ 출근체크 완료', 'var(--ok)');
  await loadMyStatus(); renderState();
}
async function doOvertimeCheck(){
  var res = await updateMyCrewEntry({overtimeCheckAt:new Date().toISOString()});
  if(res.error){ showToast('❌ 연장근무 신청 실패: '+res.error.message, 'var(--err)'); return; }
  showToast('🔥 연장근무 신청 완료', 'var(--ok)');
  await loadMyStatus(); renderState();
}
async function doCheckOut(){
  if(lastDistance==null || lastDistance>GEOFENCE_M){ showToast('⚠️ 반경 '+formatDist(GEOFENCE_M)+' 이내에서만 퇴근체크할 수 있습니다', 'var(--err)'); return; }
  if(new Date() < checkoutGate()){ showToast('⚠️ 아직 퇴근체크 시간이 아닙니다', 'var(--err)'); return; }
  var res = await updateMyCrewEntry({checkOutAt:new Date().toISOString(), checkOutDistanceM:Math.round(lastDistance)});
  if(res.error){ showToast('❌ 퇴근체크 실패: '+res.error.message, 'var(--err)'); return; }
  showToast('✅ 퇴근체크 완료 — 수고하셨습니다', 'var(--ok)');
  await loadMyStatus(); renderState();
}

function renderState(){
  var statusEl = document.getElementById('ciStatus');
  var actionsEl = document.getElementById('ciActions');
  var distLine = lastDistanceErr
    ? '<div class="dim">'+lastDistanceErr+'</div>'
    : (lastDistance!=null ? '<div class="dim">현장까지 '+formatDist(lastDistance)+'</div>' : '');

  if(!myCrew || !myCrew.checkInAt){
    statusEl.innerHTML = '아직 출근체크 전입니다'+distLine;
    var canCheckIn = lastDistance!=null && lastDistance<=GEOFENCE_M;
    actionsEl.innerHTML = '<button type="button" class="sbtn sbtn-main" id="btnCheckIn" '+(canCheckIn?'':'disabled')+'>📍 출근체크</button>';
    var btn = document.getElementById('btnCheckIn'); if(btn) btn.onclick = doCheckIn;
    return;
  }

  if(myCrew.checkOutAt){
    statusEl.innerHTML = '출근 <b>'+fmtTime(myCrew.checkInAt)+'</b> · 퇴근 <b>'+fmtTime(myCrew.checkOutAt)+'</b>'
      + (myCrew.overtimeCheckAt ? '<br><span style="font-size:13px;color:var(--brand-2);">🔥 연장근무</span>' : '');
    actionsEl.innerHTML = '<div class="ci-done">✅ 오늘 출력체크 완료</div>';
    return;
  }

  // 출근함, 퇴근 전
  var now = new Date();
  var deadline1705 = new Date(); deadline1705.setHours(17,5,0,0);
  var canDeclareOvertime = !myCrew.overtimeCheckAt && now < deadline1705 && overtimeSetForToday();
  var gate = checkoutGate();
  var canCheckOut = now>=gate && lastDistance!=null && lastDistance<=GEOFENCE_M;

  statusEl.innerHTML = '출근 <b>'+fmtTime(myCrew.checkInAt)+'</b>'
    + (myCrew.overtimeCheckAt ? '<br><span style="font-size:13px;color:var(--brand-2);">🔥 연장근무 신청됨</span>' : '')
    + distLine;

  var html = '';
  if(canDeclareOvertime){
    html += '<button type="button" class="sbtn sbtn-outline" id="btnOvertime">🔥 연장근무 체크 ('+deadline1705.getHours()+':'+String(deadline1705.getMinutes()).padStart(2,'0')+'까지)</button>';
  }
  html += '<button type="button" class="sbtn sbtn-main" id="btnCheckOut" '+(canCheckOut?'':'disabled')+'>🚪 퇴근체크</button>';
  if(!canCheckOut){
    html += '<div class="ci-sub">'+fmtGate(gate)+'부터 반경 '+formatDist(GEOFENCE_M)+' 이내에서 가능</div>';
  }
  actionsEl.innerHTML = html;
  var ob = document.getElementById('btnOvertime'); if(ob) ob.onclick = doOvertimeCheck;
  var cb = document.getElementById('btnCheckOut'); if(cb) cb.onclick = doCheckOut;
}

async function refreshAll(){
  await refreshDistance();
  renderState();
}

(async function init(){
  await loadSettings();
  await loadMyStatus();
  await refreshDistance();
  renderState();
  setInterval(refreshAll, 30000);
})();
</script>

<script>
/* work-report-daesun과 동일한 서비스워커 자동 업데이트 패턴(2026-08-06). */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    function promptUpdate(){
      if(document.getElementById('updateBanner'))return;
      var b=document.createElement('div');
      b.id='updateBanner';
      b.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A2332;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:99999;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,0.35);white-space:nowrap;';
      b.innerHTML='새 버전이 있습니다 <button id="updateBtn" style="background:#FEE500;color:#1A2332;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:800;cursor:pointer;">업데이트</button>';
      document.body.appendChild(b);
      document.getElementById('updateBtn').onclick=function(){
        if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      };
    }
    if(reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('SKIP_WAITING');
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed' && navigator.serviceWorker.controller) promptUpdate();
      });
    });
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible') reg.update();
    });
    reg.update();
  });
  var wrReloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(wrReloading)return;
    wrReloading=true;
    location.reload();
  });
}

/* ── 권한 부족으로 되돌아온 경우 안내 한 번만 표시 (role-gate.js가 남긴 쪽지) ── */
(function(){
  try{
    if(sessionStorage.getItem('wr_role_denied')){
      sessionStorage.removeItem('wr_role_denied');
      document.getElementById('deniedNote').style.display='';
    }
  }catch(e){}
})();

/* ── 내 출력일수(2026-08-09) ──
   daily_reports를 팀+월로 좁혀서 가져온 뒤 crew[]에서 내 member_id가 든 날을 센다.
   별도 테이블을 만들지 않는 이유는 관리자 화면의 출력일지가 이미 같은 원천(crew)을 쓰고
   있어서다 — 원천을 둘로 나누면 두 화면의 숫자가 어긋난다. */
function ymOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
(function initMyDaysMonths(){
  var sel=document.getElementById('myDaysMonth');
  var now=new Date(), opts=[];
  for(var i=0;i<6;i++){
    var d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    opts.push('<option value="'+ymOf(d)+'">'+d.getFullYear()+'년 '+(d.getMonth()+1)+'월</option>');
  }
  sel.innerHTML=opts.join('');
})();

async function loadMyDays(){
  var listEl=document.getElementById('myDaysList');
  var sumEl=document.getElementById('myDaysSummary');
  var myId=localStorage.getItem('member_id');
  var team=localStorage.getItem('member_team')||'미지정';
  var ym=document.getElementById('myDaysMonth').value;
  if(!sbClient || !myId){ listEl.textContent='불러올 수 없습니다.'; return; }
  listEl.textContent='불러오는 중...'; sumEl.innerHTML='';
  try{
    /* 소속이 바뀐 적이 있으면 예전 팀 행에도 내 기록이 남아 있다. 팀으로 좁히면 그게 빠지므로
       날짜 범위로만 좁히고 crew 안에서 내 id로 거른다(회원 1~수십 명 규모라 부담 없음). */
    var res=await sbClient.from('daily_reports')
      .select('date,crew')
      .gte('date', ym+'-01').lte('date', ym+'-31')
      .order('date');
    if(res.error){ listEl.textContent='불러오기 실패: '+res.error.message; return; }

    var days=[];
    (res.data||[]).forEach(function(row){
      var crew=Array.isArray(row.crew)?row.crew:[];
      var me=crew.find(function(c){ return String(c.member_id)===String(myId); });
      if(me && me.checkInAt) days.push({date:row.date, me:me});
    });
    // 같은 날 여러 팀 행에 걸쳐 있어도 하루는 하루로 센다.
    var seen={}, uniq=[];
    days.forEach(function(d){ if(!seen[d.date]){ seen[d.date]=1; uniq.push(d); } });

    var overtime=uniq.filter(function(d){ return d.me.overtimeCheckAt; }).length;
    function pill(label, value, color){
      return '<div style="flex:1;background:var(--field-bg);border:1px solid var(--field-bd);border-radius:10px;padding:10px;text-align:center;">'
        +'<div style="font-size:20px;font-weight:800;color:'+color+';">'+value+'</div>'
        +'<div style="font-size:11px;color:var(--lbl);margin-top:2px;">'+label+'</div></div>';
    }
    sumEl.innerHTML = pill('출력일수', uniq.length+'일', 'var(--brand-2)')
      + pill('연장근무', overtime+'일', '#8A5D0C');

    if(!uniq.length){ listEl.innerHTML='<div style="padding:8px 0;">이 달에는 출력 기록이 없습니다.</div>'; return; }
    listEl.innerHTML = uniq.map(function(d){
      // checkInAt/checkOutAt은 toISOString()으로 저장된 UTC라 문자열을 그대로 자르면
      // 9시간 어긋난다(위 카드의 fmtTime과 값이 달라 보이던 원인) — 현지시각으로 변환한다.
      var t=function(v){ return v ? fmtTime(v) : '-'; };
      return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--field-bg);">'
        +'<span style="color:var(--ink);font-weight:700;">'+d.date+'</span>'
        +'<span>출근 '+t(d.me.checkInAt)+' · 퇴근 '+t(d.me.checkOutAt)+(d.me.overtimeCheckAt?' · 연장':'')+'</span>'
        +'</div>';
    }).join('');
  }catch(e){ listEl.textContent='불러오기 실패: '+(e.message||e); }
}
loadMyDays();
</script>
